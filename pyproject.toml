[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nemo-workplace"
version = "0.1.0"
description = "Pinned NeMo Workplace Assistant tool provider"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pandas>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_workplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/nemo_workplace/vendor/workplace_assistant_tools"]

[tool.ruff.lint]
ignore = ["TRY004"]
